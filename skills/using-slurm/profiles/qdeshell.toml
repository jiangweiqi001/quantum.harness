[identity]
name = "qdeshell"
purpose = "Dzeshell GPU compute service"
maintainer = "QuantumBFS"

[connection]
repo_path_remote = "/work/share/giggleliu/jiangweiqi/quantum.harness"
login_shell = false

[connection.ssh]
alias = "qdeshell"

[scheduler]
type = "slurm"
default_partition = "dzagnormal"

[[partitions]]
name = "dzagnormal"
class = "gpu"
cores = 64
memory = "515704M"
max_wall = "24:00:00"
gpu = "NVIDIAA80080GBPCIeLC:8"
required_gres = "gpu:NVIDIAA80080GBPCIeLC:1"
cpus_per_gpu = 8

[filesystem]
home = "~"
scratch = "/work/share/giggleliu/jiangweiqi/results"
project = "/work/share/giggleliu/jiangweiqi/quantum.harness"
quota = ""

[network]
internet_from_login = false
internet_from_compute = false

[region]
region = "mainland_china"

[limits.hard]
max_walltime = "24:00:00"
max_nodes = 1
max_cpus = 64
max_array_size = 200

[limits.soft]
warn_walltime = "08:00:00"
warn_cpus = 16
unusual_partitions = ["dzagnormal"]

[limits.paths]
allowed_roots = [
  "/work/share/giggleliu/jiangweiqi/results",
  "/work/share/giggleliu/jiangweiqi/quantum.harness/results",
]

[[gotchas]]
symptom = "A request is rejected when CPU and GPU counts are not proportional"
cause = "dzagnormal allocates eight CPUs per requested GPU"
fix = "use a tracked size-class wrapper and validate it with sbatch --test-only"

[[gotchas]]
symptom = "A valid test-only request has a distant estimated start"
cause = "the visible production partition has a long queue estimate"
fix = "show the estimate and obtain explicit approval before any real submission"

[commands]
squeue = "squeue -u $USER"
sacct = "sacct --format=JobID,State,ExitCode,MaxRSS,Elapsed"
sinfo = "sinfo -o '%P %a %.10l %.6D %.6t'"
quota_command = "sacctmgr -n -P show assoc where user=$USER format=Account,Partition,QOS,GrpTRES,MaxTRES"

[notes]
text = "Login and compute nodes are offline. Use only the shared CPython 3.12 runtime, repository virtual environment, and results roots."
